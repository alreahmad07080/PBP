<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUMENT</title>
</head>
<body>
<form>
    Nama: <input type="text" name="nama"><br><br>
    Warna: <input type="color" name="warna"><br><br>
    Gender: <input type="radio" name="gender" value="L"> laki laki
            <input type="radio" name="gender" value="p"> Perempuan<br><br>
    Tanggal Lahir: <input type="date" name="Lahir"><br><br>
    Anak Nomor: <input type="number" name="nomor"><br><br>
    Hobi: <input type="checkbox" name="hobi" value="jogging"> jogging
          <input type="checkbox" name="hobi" value="game"> game <br><br>
    Web: <input type="url" name="website"><br><br>
 
</form>

<form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="Masukkan Username"> <br><br>
</form>

<form>
    <label for="Jurusan">Pilh Jurusan:</label>
    <select name="Jurusan" id="Jurusan">
        <option value="TI">Teknik Informatika</option>
        <option value="SI">Sistem Informasi</option>
    </select> <br><br>
    <button type="submit">Submit Form</button>
</form>
    

</body>
</html>
