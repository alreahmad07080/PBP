<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Customer - CasualKick</title>
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-lg p-4 rounded-4" style="max-width: 400px; width: 90%; background-color: #1e1e2f;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-white">Login Customer</h2>
      <hr class="border-secondary">
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label text-light">Nama Pengguna</label>
        <input type="text" id="username" class="form-control bg-dark text-light border-secondary" placeholder="Masukkan username" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-light">Kata Sandi</label>
        <input type="password" id="password" class="form-control bg-dark text-light border-secondary" placeholder="Masukkan password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2">Masuk</button>

      <p class="note text-center mt-3 text-secondary">
        Gunakan username <b>customer</b> dan password <b>12345</b>
      </p>
    </form>
  </div>

  <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
  <script src="login.js"></script>
</body>
</html>
